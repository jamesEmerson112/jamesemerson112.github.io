<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="robots" content="noindex">
  <title>Page not found - James Emerson Vo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* Served by Vercel / GitHub Pages for unknown paths. Matches the main
       site's tokens (see src/styles/themes.css); no scripts. */
    :root {
      color-scheme: dark;
      --bg: #000000;
      --text: #9aa0a0;
      --heading: #eef1f1;
      --line: rgba(255, 255, 255, 0.14);
      --acc: #5ccfd6;
      --acc-hover: #a9ecef;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f7f7f5;
        --text: #4a5555;
        --heading: #14201f;
        --line: rgba(0, 0, 0, 0.18);
        --acc: #17757b;
        --acc-hover: #12666b;
      }
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 520px;
    }

    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--acc);
      margin: 0 0 14px;
    }

    h1 {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 300;
      font-size: clamp(40px, 8vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.035em;
      color: var(--heading);
      margin: 0 0 18px;
      text-wrap: balance;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--heading);
      text-decoration: none;
    }

    a.primary {
      color: var(--acc);
      border-color: color-mix(in srgb, var(--acc) 55%, transparent);
      background: color-mix(in srgb, var(--acc) 8%, transparent);
    }

    a:hover {
      color: var(--acc-hover);
      border-color: var(--acc);
    }

    a:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">// 404</p>
    <h1>This page wandered off.</h1>
    <p>The link may be outdated or mistyped. Everything on this site lives on the home page and the blog.</p>
    <div class="links">
      <a class="primary" href="/">← Back to the portfolio</a>
      <a href="/#posts">Read the blog</a>
    </div>
  </main>
</body>
</html>
